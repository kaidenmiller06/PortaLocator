<html>
  <head>
    <title>PortaLocator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="./global.css" />
  </head>

  <body style="margin: 0; padding: 0; display: flex;">
    <!-- Map -->
    <div id="map" style="flex: 1; height: 100vh; width: 100vw;"></div>


    <div class="sidebar" id="sidebar">


      <!-- ----------------------------------------------------- -->
      <!-- Create Porta Potty Panel -->
      <!-- ----------------------------------------------------- -->
      <div class="panel" id="panel-create">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">New Porta Potty</h5>
          <button type="button" class="btn-close"></button>
        </div>

        <div id="miniMap-create" style="width: 100%; height: 150px; border-radius: 8px;" class="mb-3"></div>

        <form id="createPortaPottyForm" class="m-0">
          <div class="form-fields">
            <input type="hidden" id="create_porta_potty">

            <!-- Name -->
            <div class="mb-3">
              <label for="porta_potty_name" class="form-label">
                Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="porta_potty_name" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="porta_potty_description" class="form-label">Description</label>
              <textarea class="form-control" id="porta_potty_description"></textarea>
            </div>

            <!-- Rating -->
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <div id="star-rating" class="d-flex gap-1 fs-3">
                <i class="bi bi-star star" data-value="1" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="2" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="3" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="4" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="5" style="cursor:pointer; color: gold;"></i>
              </div>
              <input type="hidden" id="porta_potty_rating" value="0">
            </div>

            <div class="mb-2">
              Other
            </div>

            <!-- Private Access -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="porta_potty_private" value="1">
                <label class="form-check-label" for="porta_potty_private">
                  Private Porta Potty <i class="bi bi-lock-fill"></i>
                </label>
              </div>
            </div>

            <!-- Accessiblity -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="porta_potty_accessible" value="1">
                <label class="form-check-label" for="porta_potty_accessible">
                  Wheelchair Access <i class="bi bi-person-wheelchair"></i>
                </label>
              </div>
            </div>

            <!-- Women's Products -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="porta_potty_womens_products" value="1">
                <label class="form-check-label" for="porta_potty_womens_products">
                  Women's Products <i class="bi bi-gender-female"></i>
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create Porta Potty</button>
          </div>
        </form>
      </div>


      <!-- ----------------------------------------------------- -->
      <!-- View Porta Potty Panel -->
      <!-- ----------------------------------------------------- -->
      <div class="panel" id="panel-view">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">View Porta Potty</h5>
          <button type="button" class="btn-close"></button>
        </div>

        <div id="miniMap-view" style="width: 100%; height: 150px; border-radius: 8px;" class="mb-3"></div>

        <div class="form-fields">
          <!-- Name -->
          <div class="mb-3">
            <label for="view_porta_potty_name" class="form-label">
              Name <span class="text-danger">*</span>
            </label>
            <input type="text" class="form-control" id="view_porta_potty_name" required>
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label for="view_porta_potty_description" class="form-label">Description</label>
            <textarea class="form-control" id="view_porta_potty_description"></textarea>
          </div>

          <!-- Rating -->
          <div class="mb-3">
            <label class="form-label">Rating</label>
            <div id="star-rating" class="d-flex gap-1 fs-3">
              <i class="bi bi-star star" data-value="1" style="cursor:pointer; color: gold;"></i>
              <i class="bi bi-star star" data-value="2" style="cursor:pointer; color: gold;"></i>
              <i class="bi bi-star star" data-value="3" style="cursor:pointer; color: gold;"></i>
              <i class="bi bi-star star" data-value="4" style="cursor:pointer; color: gold;"></i>
              <i class="bi bi-star star" data-value="5" style="cursor:pointer; color: gold;"></i>
            </div>
            <input type="hidden" id="view_porta_potty_rating" value="0">
          </div>

          <div class="mb-2">
            Other
          </div>

          <!-- Private Access -->
          <div class="mb-3 ps-1">
            <div class="form-check form-switch m-0">
              <input type="checkbox" class="form-check-input" id="view_porta_potty_private" value="1">
              <label class="form-check-label" for="view_porta_potty_private">
                Private Porta Potty <i class="bi bi-lock-fill"></i>
              </label>
            </div>
          </div>

          <!-- Accessiblity -->
          <div class="mb-3 ps-1">
            <div class="form-check form-switch m-0">
              <input type="checkbox" class="form-check-input" id="view_porta_potty_accessible" value="1">
              <label class="form-check-label" for="view_porta_potty_accessible">
                Wheelchair Access <i class="bi bi-person-wheelchair"></i>
              </label>
            </div>
          </div>

          <!-- Women's Products -->
          <div class="mb-3 ps-1">
            <div class="form-check form-switch m-0">
              <input type="checkbox" class="form-check-input" id="view_porta_potty_womens_products" value="1">
              <label class="form-check-label" for="view_porta_potty_womens_products">
                Women's Products <i class="bi bi-gender-female"></i>
              </label>
            </div>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100 mb-3" id="editPortaPottyBtn">Edit Porta Potty</button>
        <button type="button" class="btn btn-danger w-100" id="deletePortaPottyBtn">Delete Porta Potty</button>
      </div>


      <!-- ----------------------------------------------------- -->
      <!-- Edit Porta Potty Panel -->
      <!-- ----------------------------------------------------- -->
      <div class="panel" id="panel-edit">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">Edit Porta Potty</h5>
          <button type="button" class="btn-close"></button>
        </div>

        <div id="miniMap-edit" style="width: 100%; height: 150px; border-radius: 8px;" class="mb-3"></div>

        <form id="editPortaPottyForm" class="m-0">
          <div class="form-fields">
            <input type="hidden" id="edit_porta_potty">

            <!-- Name -->
            <div class="mb-3">
              <label for="edit_porta_potty_name" class="form-label">
                Edit Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="edit_porta_potty_name" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="edit_porta_potty_description" class="form-label">Description</label>
              <textarea class="form-control" id="edit_porta_potty_description"></textarea>
            </div>

            <!-- Rating -->
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <div id="star-rating" class="d-flex gap-1 fs-3">
                <i class="bi bi-star star" data-value="1" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="2" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="3" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="4" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="5" style="cursor:pointer; color: gold;"></i>
              </div>
              <input type="hidden" id="edit_porta_potty_rating" value="0">
            </div>

            <div class="mb-2">
              Other
            </div>

            <!-- Private Access -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="edit_porta_potty_private" value="1">
                <label class="form-check-label" for="edit_porta_potty_private">
                  Private Porta Potty </P> <i class="bi bi-lock-fill"></i>
                </label>
              </div>
            </div>

            <!-- Accessiblity -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="edit_porta_potty_accessible" value="1">
                <label class="form-check-label" for="edit_porta_potty_accessible">
                  Wheelchair Access <i class="bi bi-person-wheelchair"></i>
                </label>
              </div>
            </div>

            <!-- Women's Products -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="edit_porta_potty_womens_products" value="1">
                <label class="form-check-label" for="edit_porta_potty_womens_products">
                  Women's Products <i class="bi bi-gender-female"></i>
                </label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Save Changes</button>
        </form>
      </div>


    </div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
