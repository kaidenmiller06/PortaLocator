<html>
  <head>
    <title>PortaLocator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" type="text/css" href="./global.css" />
  </head>

  <body style="margin: 0; padding: 0; display: flex;">
    <!-- Profile Button -->
    <div style="position: fixed; top: 1rem; left: 1rem; z-index: 1000;">
      <button class="btn btn-light border rounded-circle theme-btn"
        data-bs-toggle="modal"
        data-bs-target="#profileModal"
        style="width: 45px; height: 45px; padding: 0;">
        <i class="bi bi-person-fill"></i>
      </button>
    </div>

    <!-- Theme Toggle Button -->
    <div style="position: fixed; top: 1rem; left: 5rem; z-index: 1000;">
      <button class="btn btn-light border rounded-circle theme-btn"
        id="themeBtn"
        style="width: 45px; height: 45px; padding: 0;">
        <i class="bi bi-sun-fill" id="theme-icon"></i>
      </button>
    </div>

    <!-- Map -->
    <div id="map" style="flex: 1; height: 100vh; width: 100vw;"></div>


    <!-- Sidebar -->
    <div class="sidebar border-start" id="sidebar">


      <!-- ----------------------------------------------------- -->
      <!-- Create Porta Potty Panel -->
      <!-- ----------------------------------------------------- -->
      <div class="panel d-flex flex-column" id="panel-create">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">New Porta Potty</h5>
          <button type="button" class="btn-close"></button>
        </div>

        <div id="miniMap-create" style="width: 100%; height: 150px; border-radius: 8px;" class="mb-3"></div>

        <form id="createPortaPottyForm" class="m-0 d-flex flex-column flex-grow-1">
          <div class="form-fields d-flex flex-column flex-grow-1">
            <input type="hidden" id="create_porta_potty">

            <!-- Name -->
            <div class="mb-3">
              <label for="porta_potty_name" class="form-label">
                Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="porta_potty_name" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="porta_potty_description" class="form-label">Description</label>
              <textarea class="form-control" id="porta_potty_description"></textarea>
            </div>

            <!-- Rating -->
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <div id="star-rating" class="d-flex gap-1 fs-3">
                <i class="bi bi-star star" data-value="1" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="2" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="3" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="4" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="5" style="cursor:pointer; color: gold;"></i>
              </div>
              <input type="hidden" id="porta_potty_rating" value="0">
            </div>

            <div class="mb-2">
              Badges
            </div>

            <!-- Private Access -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="porta_potty_private" value="1">
                <label class="form-check-label" for="porta_potty_private">
                  Private Porta Potty <i class="bi bi-lock-fill"></i>
                </label>
              </div>
            </div>

            <!-- Accessiblity -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="porta_potty_accessible" value="1">
                <label class="form-check-label" for="porta_potty_accessible">
                  Wheelchair Access <i class="bi bi-person-wheelchair"></i>
                </label>
              </div>
            </div>

            <!-- Women's Products -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="porta_potty_womens_products" value="1">
                <label class="form-check-label" for="porta_potty_womens_products">
                  Women's Products <i class="bi bi-gender-female"></i>
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-auto">Create Porta Potty</button>
          </div>
        </form>
      </div>


      <!-- ----------------------------------------------------- -->
      <!-- View Porta Potty Panel -->
      <!-- ----------------------------------------------------- -->
      <div class="panel d-flex flex-column" id="panel-view">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0" id="view_porta_potty_name">View Porta Potty</h5>
          <button type="button" class="btn-close"></button>
        </div>

        <div id="miniMap-view" style="width: 100%; height: 150px; border-radius: 8px;" class="mb-3"></div>

        <div class="form-fields d-flex flex-column flex-grow-1">
          <!-- Description -->
          <div class="mb-3">
            <p class="form-control-plaintext" id="view_porta_potty_description">Description</p>
          </div>

          <!-- Rating -->
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <div id="view-star-rating" class="d-flex gap-1 fs-3" style="pointer-events: none;">
                <i class="bi bi-star star" data-value="1" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="2" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="3" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="4" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="5" style="cursor:pointer; color: gold;"></i>
              </div>
              <input type="hidden" id="view_porta_potty_rating" value="0">

              <div id="votes" class="d-flex gap-1 fs-3 align-items-center">
                <i class="bi bi-arrow-up-square" id="upvoteBtn" style="cursor:pointer;"></i>
                <p id="voteCount" class="m-0">0</p>
                <i class="bi bi-arrow-down-square" id="downvoteBtn" style="cursor:pointer;"></i>
              </div>
            </div>
          </div>

          <div id="view_porta_potty_badges_header" class="mb-2">
            Badges
          </div>

          <!-- Badges (Private, Wheelchair, etc.) -->
          <div class="mb-3 d-flex gap-2 flex-wrap">
            <span id="view_porta_potty_private_badge" class="badge rounded-pill bg-secondary d-none">
              <i class="bi bi-lock-fill me-1"></i>Private
            </span>
            <span id="view_porta_potty_accessible_badge" class="badge rounded-pill bg-primary d-none">
              <i class="bi bi-person-wheelchair me-1"></i>Wheelchair Access
            </span>
            <span id="view_porta_potty_womens_products_badge" class="badge rounded-pill bg-pink d-none" style="background-color: #d63384;">
              <i class="bi bi-gender-female me-1"></i>Women's Products
            </span>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100 mb-3 mt-auto" id="editPortaPottyBtn">Edit Porta Potty</button>
        <button type="button" class="btn btn-danger w-100 mt-auto" id="deletePortaPottyBtn">Delete Porta Potty</button>
      </div>


      <!-- ----------------------------------------------------- -->
      <!-- Edit Porta Potty Panel -->
      <!-- ----------------------------------------------------- -->
      <div class="panel d-flex flex-column" id="panel-edit">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0">Edit Porta Potty</h5>
          <button type="button" class="btn-close"></button>
        </div>

        <div id="miniMap-edit" style="width: 100%; height: 150px; border-radius: 8px;" class="mb-3"></div>

        <form id="editPortaPottyForm" class="m-0 d-flex flex-column flex-grow-1">
          <div class="form-fields d-flex flex-column flex-grow-1">
            <input type="hidden" id="edit_porta_potty">

            <!-- Name -->
            <div class="mb-3">
              <label for="edit_porta_potty_name" class="form-label">
                Edit Name <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="edit_porta_potty_name" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="edit_porta_potty_description" class="form-label">Description</label>
              <textarea class="form-control" id="edit_porta_potty_description"></textarea>
            </div>

            <!-- Rating -->
            <div class="mb-3">
              <label class="form-label">Rating</label>
              <div id="edit-star-rating" class="d-flex gap-1 fs-3">
                <i class="bi bi-star star" data-value="1" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="2" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="3" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="4" style="cursor:pointer; color: gold;"></i>
                <i class="bi bi-star star" data-value="5" style="cursor:pointer; color: gold;"></i>
              </div>
              <input type="hidden" id="edit_porta_potty_rating" value="0">
            </div>

            <div class="mb-2">
              Badges
            </div>

            <!-- Private Access -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="edit_porta_potty_private" value="1">
                <label class="form-check-label" for="edit_porta_potty_private">
                  Private Porta Potty <i class="bi bi-lock-fill"></i>
                </label>
              </div>
            </div>

            <!-- Accessiblity -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="edit_porta_potty_accessible" value="1">
                <label class="form-check-label" for="edit_porta_potty_accessible">
                  Wheelchair Access <i class="bi bi-person-wheelchair"></i>
                </label>
              </div>
            </div>

            <!-- Women's Products -->
            <div class="mb-3 ps-1">
              <div class="form-check form-switch m-0">
                <input type="checkbox" class="form-check-input" id="edit_porta_potty_womens_products" value="1">
                <label class="form-check-label" for="edit_porta_potty_womens_products">
                  Women's Products <i class="bi bi-gender-female"></i>
                </label>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-auto">Save Changes</button>
        </form>
      </div>


    </div>


    <!-- Profile Modal -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="profileModalLabel">Profile</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="d-flex align-items-center gap-3 mb-3">
              <!-- Profile Picture -->
              <div class="rounded-circle flex-shrink-0 d-flex align-items-center justify-content-center bg-secondary" id="profile_picture_container" style="width: 80px; height: 80px;">
                <i class="bi bi-person-fill text-white" id="profile_picture_icon" style="font-size: 2.5rem;"></i>
                <img id="profile_picture" alt="Profile Picture" class="rounded-circle d-none" style="width: 80px; height: 80px; object-fit: cover;">
              </div>

              <!-- Profile Info -->
              <div>
                <p class="mb-0"><strong>Name:</strong> <span id="profile_name"></span></p>
                <p class="mb-0"><strong>Email:</strong> <span id="profile_email"></span></p>
                <p class="mb-0 text-muted">Member since <span id="profile_created_at"></span></p>
              </div>
            </div>
            <hr>
            <p class="mb-1"><strong><i class="bi bi-geo-alt-fill"> </i>Porta Potties:</strong> <span id="profile_porta_potties"></span></p>
            <p><strong><i class="bi bi-arrow-up-square-fill"> </i>Votes:</strong> <span id="profile_votes"></span></p>
            <button class="btn btn-danger w-100" id="logoutBtn">Logout</button>
          </div>
        </div>
      </div>
    </div>


    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
